<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RCJ Public Team Documents</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --card: #0b1220;
      --line: #334155;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #7dd3fc;
      --shadow: rgba(2, 6, 23, .34);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: radial-gradient(circle at top left, rgba(56, 189, 248, .16), transparent 28rem), var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a { color: var(--accent-2); }
    button, input, select {
      font: inherit;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
    }
    button { cursor: pointer; }
    button:hover, a.card:hover { border-color: var(--accent); }
    header.app {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(15, 23, 42, .96);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 8px 30px var(--shadow);
      backdrop-filter: blur(10px);
    }
    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 16px 20px 10px;
    }
    h1 { margin: 0; font-size: clamp(22px, 2vw, 30px); letter-spacing: -.03em; }
    .summary { color: var(--muted); margin-top: 2px; }
    nav.tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: end; }
    .tab {
      text-decoration: none;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      white-space: nowrap;
    }
    .tab.active { border-color: var(--accent); color: #e0f2fe; background: rgba(56, 189, 248, .13); }
    .filters {
      display: grid;
      grid-template-columns: minmax(240px, 2fr) repeat(3, minmax(150px, 1fr));
      gap: 10px;
      padding: 0 20px 16px;
    }
    main { padding: 20px; }
    .directory {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .team-card {
      display: grid;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      background: linear-gradient(180deg, rgba(17, 24, 39, .96), rgba(11, 18, 32, .96));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      min-height: 100%;
      box-shadow: 0 16px 36px var(--shadow);
    }
    .thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .thumb {
      position: relative;
      aspect-ratio: 4 / 3;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #020617;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 13px;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb .label {
      position: absolute;
      left: 8px;
      bottom: 8px;
      background: rgba(2, 6, 23, .76);
      border: 1px solid rgba(148, 163, 184, .28);
      color: #f8fafc;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
    }
    .thumb.broken img { display: none; }
    .team-title { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
    .team-title h2 { margin: 0; font-size: 20px; line-height: 1.15; }
    .code { color: var(--accent-2); font-weight: 700; white-space: nowrap; }
    .muted { color: var(--muted); }
    .topics { display: flex; gap: 6px; flex-wrap: wrap; }
    .topic {
      border: 1px solid rgba(125, 211, 252, .28);
      background: rgba(56, 189, 248, .10);
      color: #bae6fd;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
    }
    .empty {
      border: 1px dashed var(--line);
      border-radius: 16px;
      color: var(--muted);
      padding: 28px;
      text-align: center;
      background: rgba(17, 24, 39, .6);
    }
    .detail { display: grid; gap: 18px; }
    .back { justify-self: start; width: auto; }
    .hero {
      display: grid;
      grid-template-columns: minmax(260px, 440px) 1fr;
      gap: 18px;
      align-items: stretch;
    }
    .hero-media {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
    }
    .hero-copy {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 16px 36px var(--shadow);
    }
    .hero-copy h2 { margin: 0 0 6px; font-size: clamp(28px, 4vw, 48px); line-height: 1.05; letter-spacing: -.04em; }
    .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 18px 0; }
    .fact { background: rgba(15, 23, 42, .75); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
    .fact strong { display: block; color: #f8fafc; font-size: 18px; }
    .quicklinks { display: flex; flex-wrap: wrap; gap: 8px; }
    .quicklinks a, .open-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: 999px;
      padding: 8px 11px;
      color: var(--text);
      text-decoration: none;
    }
    .section-title { margin: 10px 0 0; font-size: 24px; }
    .asset-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; align-items: start; }
    .asset {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
      min-width: 0;
    }
    .asset h3 { margin: 0 0 10px; font-size: 18px; }
    .asset iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #020617;
    }
    .asset.video-feature {
      grid-column: 1 / -1;
      padding: 14px;
    }
    .asset.video-feature h3 { font-size: 24px; }
    .asset.video-feature iframe { aspect-ratio: 16 / 9; }
    .asset.compact { display: grid; align-content: start; gap: 12px; }
    .asset.compact p { margin: 0; color: var(--muted); }
    @media (max-width: 980px) {
      .topbar { grid-template-columns: 1fr; }
      nav.tabs { justify-content: start; }
      .filters { grid-template-columns: 1fr; }
      .hero { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      main, .topbar, .filters { padding-left: 12px; padding-right: 12px; }
      .directory { grid-template-columns: 1fr; }
      .asset-grid { grid-template-columns: 1fr; }
      .hero-media { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<header class="app">
  <div class="topbar">
    <div>
      <h1>RCJ Public Team Documents</h1>
      <div id="summary" class="summary">Loading…</div>
    </div>
    <nav class="tabs" aria-label="Primary navigation">
      <a id="directoryTab" class="tab active" href="#">Team directory</a>
      <a id="detailTab" class="tab" href="#" hidden>Team details</a>
    </nav>
  </div>
  <div class="filters" role="search">
    <input id="q" type="search" placeholder="Search team, country, topic, keyword…" autocomplete="off" />
    <select id="league"><option value="">All leagues</option></select>
    <select id="country"><option value="">All countries</option></select>
    <select id="topic"><option value="">All topics</option></select>
  </div>
</header>
<main id="main"><section class="empty">Loading team data…</section></main>
<script>
'use strict';
const $ = sel => document.querySelector(sel);
const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const labels = {
  team_photo: 'Team photo',
  robot_photo: 'Robot photo',
  poster: 'Poster',
  video: 'Video',
  launching_video: 'Launching video',
  bom: 'Bill of materials',
  source_code: 'Source code',
  tdp_pdf_optional: 'Team description paper',
  engineering_journal_optional: 'Engineering journal'
};
const detailOrder = ['poster', 'video', 'launching_video', 'bom', 'tdp_pdf_optional', 'engineering_journal_optional', 'source_code'];
const topicOrder = ['team_photo', 'robot_photo', ...detailOrder];
let teams = [], assets = [], assetsByTeam = new Map();

function normalize(value) { return String(value ?? '').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, ''); }
function assetLabel(asset) { return labels[asset.artifact] || asset.artifact.replaceAll('_', ' '); }
function isPublished(asset) { return asset.status === 'ok' && asset.consent === 'Agree' && asset.publishable && Boolean(asset.preview_url || asset.view_url || asset.download_url); }
function visibleAsset(asset) { return isPublished(asset) && !asset.artifact.endsWith('_thumbnail'); }
function teamAssets(team) { return assetsByTeam.get(team.team_code) || []; }
function orderedAssets(list, order = topicOrder) {
  const weight = new Map(order.map((name, index) => [name, index]));
  return [...list].sort((a, b) => (weight.get(a.artifact) ?? 99) - (weight.get(b.artifact) ?? 99) || assetLabel(a).localeCompare(assetLabel(b)));
}
function thumbnailUrl(asset, size = 700) {
  if (!asset || !asset.drive_file_id) return '';
  return `https://drive.google.com/thumbnail?id=${encodeURIComponent(asset.drive_file_id)}&sz=w${size}`;
}
function primaryImage(team, artifact) { return teamAssets(team).find(asset => asset.artifact === artifact && isPublished(asset)); }
function topicLabels(team) {
  return orderedAssets(teamAssets(team).filter(visibleAsset)).map(assetLabel);
}
function searchableText(team) {
  return normalize([
    team.team_code,
    team.team_name,
    team.league,
    team.country,
    ...topicLabels(team),
    ...teamAssets(team).filter(visibleAsset).map(asset => asset.artifact.replaceAll('_', ' '))
  ].join(' '));
}
function selectedCode() {
  const params = new URLSearchParams(location.hash.replace(/^#/, ''));
  return params.get('team');
}
function setSelected(code) {
  if (code) location.hash = `team=${encodeURIComponent(code)}`;
  else history.pushState('', document.title, location.pathname + location.search);
  render();
}
function selectedTeam() { return teams.find(team => team.team_code === selectedCode()); }
function passes(team) {
  const q = normalize($('#q').value).trim();
  const league = $('#league').value;
  const country = $('#country').value;
  const topic = $('#topic').value;
  const list = teamAssets(team).filter(visibleAsset);
  if (league && team.league !== league) return false;
  if (country && team.country !== country) return false;
  if (topic && !list.some(asset => asset.artifact === topic)) return false;
  if (q && !q.split(/\s+/).every(token => searchableText(team).includes(token))) return false;
  return true;
}
function renderThumb(team, artifact, label) {
  const asset = primaryImage(team, artifact);
  const src = thumbnailUrl(asset);
  return `<div class="thumb${src ? '' : ' broken'}">${src ? `<img src="${esc(src)}" alt="${esc(label)} for ${esc(team.team_name)}" loading="lazy" onerror="this.parentElement.classList.add('broken')">` : '<span>No image</span>'}<span class="label">${esc(label)}</span></div>`;
}
function renderTopics(team, limit = 5) {
  const names = [...new Set(topicLabels(team).filter(name => !['Team photo', 'Robot photo'].includes(name)))];
  const shown = names.slice(0, limit);
  const extra = names.length - shown.length;
  return `<div class="topics">${shown.map(name => `<span class="topic">${esc(name)}</span>`).join('')}${extra > 0 ? `<span class="topic">+${extra} more</span>` : ''}</div>`;
}
function renderDirectory() {
  const visible = teams.filter(passes);
  $('#directoryTab').classList.add('active');
  $('#detailTab').hidden = true;
  $('#detailTab').classList.remove('active');
  $('#summary').textContent = `${visible.length}/${teams.length} teams · ${assets.filter(visibleAsset).length} published resources`;
  $('#main').innerHTML = visible.length ? `<section class="directory">${visible.map(team => `
    <a class="team-card card" href="#team=${encodeURIComponent(team.team_code)}" aria-label="Open ${esc(team.team_name)}">
      <div class="thumbs">${renderThumb(team, 'team_photo', 'Team')}${renderThumb(team, 'robot_photo', 'Robot')}</div>
      <div class="team-title"><div><h2>${esc(team.team_name)}</h2><div class="muted">${esc(team.league)} · ${esc(team.country)}</div></div><span class="code">${esc(team.team_code)}</span></div>
      ${renderTopics(team)}
    </a>`).join('')}</section>` : '<section class="empty">No teams match the current search.</section>';
}
function renderAsset(asset) {
  const title = assetLabel(asset);
  const url = asset.preview_url || asset.view_url || asset.download_url;
  const openUrl = asset.view_url || url;
  if (asset.artifact === 'source_code') {
    return `<article id="asset-${esc(asset.artifact)}" class="asset compact"><h3>${esc(title)}</h3><p>Download or inspect the published source archive in Drive.</p><p><a class="open-link" href="${esc(openUrl)}" target="_blank" rel="noopener">Open ${esc(title)}</a></p></article>`;
  }
  return `<article id="asset-${esc(asset.artifact)}" class="asset${asset.artifact === 'video' ? ' video-feature' : ''}"><h3>${esc(title)}</h3><iframe src="${esc(url)}" title="${esc(title)} for ${esc(asset.team_code)}" loading="lazy" allow="autoplay; fullscreen"></iframe><p><a class="open-link" href="${esc(openUrl)}" target="_blank" rel="noopener">Open in Drive</a></p></article>`;
}
function renderDetail(team) {
  const list = orderedAssets(teamAssets(team).filter(visibleAsset), detailOrder).filter(asset => detailOrder.includes(asset.artifact));
  const topics = orderedAssets(teamAssets(team).filter(visibleAsset));
  $('#directoryTab').classList.remove('active');
  $('#detailTab').hidden = false;
  $('#detailTab').classList.add('active');
  $('#detailTab').textContent = `${team.team_code} details`;
  $('#detailTab').href = `#team=${encodeURIComponent(team.team_code)}`;
  $('#summary').textContent = `${team.team_name} · ${team.league} · ${team.country}`;
  $('#main').innerHTML = `<section class="detail">
    <button class="back" type="button" onclick="setSelected('')">Back to team directory</button>
    <section class="hero">
      <div class="hero-media">${renderThumb(team, 'team_photo', 'Team photo')}${renderThumb(team, 'robot_photo', 'Robot photo')}</div>
      <div class="hero-copy">
        <div class="code">${esc(team.team_code)}</div>
        <h2>${esc(team.team_name)}</h2>
        <div class="muted">${esc(team.league)} league · ${esc(team.country)}</div>
        <div class="facts"><div class="fact"><span class="muted">Published resources</span><strong>${list.length}</strong></div><div class="fact"><span class="muted">Topics</span><strong>${topics.length}</strong></div><div class="fact"><span class="muted">Country</span><strong>${esc(team.country || 'Unknown')}</strong></div></div>
        <div class="quicklinks">${list.map(asset => `<a href="#asset-${esc(asset.artifact)}">${esc(assetLabel(asset))}</a>`).join('') || '<span class="muted">No published resources configured for this team.</span>'}</div>
      </div>
    </section>
    <h2 class="section-title">Published team information</h2>
    ${list.length ? `<section class="asset-grid">${list.map(renderAsset).join('')}</section>` : '<section class="empty">No published resources are currently available for this team.</section>'}
  </section>`;
}
function render() {
  const team = selectedTeam();
  if (selectedCode() && team) renderDetail(team);
  else renderDirectory();
}
async function init() {
  const [teamData, assetData] = await Promise.all([
    fetch('data/teams.json').then(resp => resp.json()),
    fetch('data/assets.json').then(resp => resp.json())
  ]);
  teams = teamData.teams;
  const teamByCode = new Map(teams.map(team => [team.team_code, team]));
  assets = assetData.assets.filter(asset => isPublished(asset) && !(teamByCode.get(asset.team_code)?.league === 'Simulation' && (asset.artifact === 'launching_video' || asset.artifact === 'launching_video_thumbnail')));
  assetsByTeam = new Map();
  for (const asset of assets) {
    if (!assetsByTeam.has(asset.team_code)) assetsByTeam.set(asset.team_code, []);
    assetsByTeam.get(asset.team_code).push(asset);
  }
  for (const league of [...new Set(teams.map(team => team.league))].sort()) $('#league').insertAdjacentHTML('beforeend', `<option>${esc(league)}</option>`);
  for (const country of [...new Set(teams.map(team => team.country))].filter(Boolean).sort()) $('#country').insertAdjacentHTML('beforeend', `<option>${esc(country)}</option>`);
  for (const artifact of topicOrder.filter(artifact => assets.some(asset => asset.artifact === artifact))) $('#topic').insertAdjacentHTML('beforeend', `<option value="${esc(artifact)}">${esc(labels[artifact])}</option>`);
  ['q', 'league', 'country', 'topic'].forEach(id => $('#' + id).addEventListener('input', () => { if (selectedCode()) setSelected(''); else render(); }));
  window.addEventListener('hashchange', render);
  render();
}
init().catch(error => { $('#main').innerHTML = `<section class="empty"><strong>Could not load data.</strong><pre>${esc(error.stack || error)}</pre></section>`; });
</script>
</body>
</html>
