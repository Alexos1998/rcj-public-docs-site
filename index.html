<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RCJ Public Team Documents</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --card: #0b1220;
      --line: #334155;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #7dd3fc;
      --gold: #fbbf24;
      --silver: #cbd5e1;
      --bronze: #d97706;
      --shadow: rgba(2, 6, 23, .34);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: radial-gradient(circle at top left, rgba(56, 189, 248, .16), transparent 28rem), var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a { color: var(--accent-2); }
    button, input, select {
      font: inherit;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
    }
    button { cursor: pointer; }
    button:hover, a.card:hover, .league-card:hover { border-color: var(--accent); }
    header.app {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(15, 23, 42, .96);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 8px 30px var(--shadow);
      backdrop-filter: blur(10px);
    }
    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 16px 20px 10px;
      max-width: 1280px;
      margin: 0 auto;
    }
    h1 { margin: 0; font-size: clamp(22px, 2vw, 30px); letter-spacing: -.03em; }
    .summary { color: var(--muted); margin-top: 2px; }
    nav.tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: end; }
    .tab {
      text-decoration: none;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      white-space: nowrap;
    }
    .tab.active { border-color: var(--accent); color: #e0f2fe; background: rgba(56, 189, 248, .13); }
    .crumb-sep { color: var(--muted); font-size: 25px;}
    .filters {
      display: grid;
      grid-template-columns: minmax(240px, 2fr) repeat(2, minmax(150px, 1fr));
      gap: 10px;
      padding: 0 20px 16px;
      max-width: 1280px;
      margin: 0 auto;
    }
    .filters[hidden] { display: none; }
    main { padding: 20px; max-width: 1280px; margin: 0 auto; }
    .landing { display: grid; gap: 22px; }
    .landing h2, .league-view h2 { margin: 0; font-size: clamp(24px, 3vw, 38px); letter-spacing: -.03em; }
    .league-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(250px, 1fr));
      gap: 18px;
    }
    .league-card {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      background: linear-gradient(180deg, rgba(17, 24, 39, .97), rgba(11, 18, 32, .97));
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 16px;
      min-height: 460px;
      box-shadow: 0 16px 36px var(--shadow);
    }
    .league-art {
      aspect-ratio: 16 / 9;
      border: 1px solid var(--line);
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: #e0f2fe;
      background:
        radial-gradient(circle at 25% 20%, rgba(125, 211, 252, .22), transparent 9rem),
        linear-gradient(135deg, rgba(56, 189, 248, .18), rgba(15, 23, 42, .3));
      overflow: hidden;
    }
    .league-art span { font-size: clamp(34px, 4vw, 60px); font-weight: 800; letter-spacing: -.06em; opacity: .9; }
    .league-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
    .league-head h3 { margin: 0; font-size: 26px; }
    .league-actions { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .show-more, .winner-link {
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: 999px;
      padding: 8px 12px;
    }
    .show-more:hover, .winner-link:hover { border-color: var(--accent); color: #e0f2fe; }
    .winners { display: grid; gap: 8px; align-content: start; }
    .winner-row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: center;
      color: var(--text);
      text-decoration: none;
      background: rgba(15, 23, 42, .72);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 9px 10px;
    }
    .winner-row:hover { border-color: var(--accent); }
    .place {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      font-weight: 900;
      font-size: 30px;
      color: #020617;
      border: 2px solid rgba(255, 255, 255, .35);
      box-shadow: 0 8px 18px rgba(2, 6, 23, .28);
      flex: 0 0 auto;
    }
    .place-1 { background: linear-gradient(135deg, #fde68a, var(--gold)); }
    .place-2 { background: linear-gradient(135deg, #f8fafc, var(--silver)); }
    .place-3 { background: linear-gradient(135deg, #fdba74, var(--bronze)); color: #111827; }
    .directory {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .team-card {
      position: relative;
      display: grid;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      background: linear-gradient(180deg, rgba(17, 24, 39, .96), rgba(11, 18, 32, .96));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      min-height: 100%;
      box-shadow: 0 16px 36px var(--shadow);
    }
    .team-card.gold { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 16px 36px var(--shadow); }
    .team-card.silver { border-color: var(--silver); box-shadow: 0 0 0 1px var(--silver), 0 16px 36px var(--shadow); }
    .team-card.bronze { border-color: var(--bronze); box-shadow: 0 0 0 1px var(--bronze), 0 16px 36px var(--shadow); }
    .team-card .place { position: absolute; top: 12px; right: 12px; z-index: 2; }
    .thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .thumbs.single { grid-template-columns: 1fr; }
    .thumb {
      position: relative;
      aspect-ratio: 4 / 3;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #020617;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 13px;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb .label {
      position: absolute;
      left: 8px;
      bottom: 8px;
      background: rgba(2, 6, 23, .76);
      border: 1px solid rgba(148, 163, 184, .28);
      color: #f8fafc;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
    }
    .thumb.broken img { display: none; }
    .team-title { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
    .team-title h2 { margin: 0; font-size: 20px; line-height: 1.15; }
    .muted { color: var(--muted); }
    .topics { display: flex; gap: 6px; flex-wrap: wrap; }
    .topic {
      border: 1px solid rgba(125, 211, 252, .28);
      background: rgba(56, 189, 248, .10);
      color: #bae6fd;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
    }
    .keywords { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
    .keyword {
      border: 1px solid rgba(52, 211, 153, .28);
      background: rgba(52, 211, 153, .10);
      color: #6ee7b7;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
    }
    .empty {
      border: 1px dashed var(--line);
      border-radius: 16px;
      color: var(--muted);
      padding: 28px;
      text-align: center;
      background: rgba(17, 24, 39, .6);
    }
    .league-view, .detail { display: grid; gap: 18px; }
    .hero {
      display: grid;
      grid-template-columns: minmax(260px, 440px) 1fr;
      gap: 18px;
      align-items: stretch;
    }
    .hero-media {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
    }
    .hero-media.single { grid-template-columns: 1fr; }
    .hero-copy {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 16px 36px var(--shadow);
    }
    .hero-copy h2 { margin: 0 0 6px; font-size: clamp(28px, 4vw, 48px); line-height: 1.05; letter-spacing: -.04em; }
    .title-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 18px 0; }
    .fact { background: rgba(15, 23, 42, .75); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
    .fact strong { display: block; color: #f8fafc; font-size: 18px; }
    .quicklinks { display: flex; flex-wrap: wrap; gap: 8px; }
    .quicklinks a, .open-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: 999px;
      padding: 8px 11px;
      color: var(--text);
      text-decoration: none;
    }
    .section-title { margin: 10px 0 0; font-size: 24px; }
    .intro { display: grid; gap: 10px; }
    .intro p { margin: 0; line-height: 1.6; color: var(--text); }
    .asset-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; align-items: start; }
    .asset {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
      min-width: 0;
    }
    .asset h3 { margin: 0 0 10px; font-size: 18px; }
    .asset iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #020617;
    }
    .asset.video-feature { grid-column: 1 / -1; padding: 14px; }
    .asset.video-feature h3 { font-size: 24px; }
    .asset.video-feature iframe { aspect-ratio: 16 / 9; }
    .asset.compact { display: grid; align-content: start; gap: 12px; }
    .asset.compact p { margin: 0; color: var(--muted); }
    @media (max-width: 1080px) {
      .league-grid { grid-template-columns: 1fr; }
      .league-card { min-height: auto; }
    }
    @media (max-width: 980px) {
      .topbar { grid-template-columns: 1fr; }
      nav.tabs { justify-content: start; }
      .filters { grid-template-columns: 1fr; }
      .hero { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      main, .topbar, .filters { padding-left: 12px; padding-right: 12px; }
      .directory { grid-template-columns: 1fr; }
      .asset-grid { grid-template-columns: 1fr; }
      .hero-media { grid-template-columns: 1fr; }
      .winner-row { grid-template-columns: auto 1fr; }
    }
  </style>
</head>
<body>
<header class="app">
  <div class="topbar">
    <div>
      <h1>RCJ Public Team Documents</h1>
      <div id="summary" class="summary">Loading…</div>
    </div>
    <nav id="breadcrumb" class="tabs breadcrumb" aria-label="Breadcrumb"></nav>
  </div>
  <div id="filters" class="filters" role="search" hidden>
    <input id="q" type="search" placeholder="Search this league by team, country, topic, keyword…" autocomplete="off" />
    <select id="country"><option value="">All countries</option></select>
    <select id="topic"><option value="">All topics</option></select>
  </div>
</header>
<main id="main"><section class="empty">Loading team data…</section></main>
<script>
'use strict';
const $ = sel => document.querySelector(sel);
const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const labels = {
  team_photo: 'Team photo',
  robot_photo: 'Robot photo',
  poster: 'Poster',
  video: 'Video',
  launching_video: 'Launching video',
  bom: 'Bill of materials',
  source_code: 'Source code',
  tdp_pdf_optional: 'Team description paper',
  engineering_journal_optional: 'Engineering journal'
};
const leagueOrder = ['Line', 'Maze', 'Simulation'];
const detailOrder = ['poster', 'video', 'launching_video', 'bom', 'tdp_pdf_optional', 'engineering_journal_optional', 'source_code'];
const topicOrder = ['team_photo', 'robot_photo', ...detailOrder];
let teams = [], assets = [], assetsByTeam = new Map(), winners = {}, winnerByTeam = new Map(), teamByCode = new Map();

function normalize(value) { return String(value ?? '').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, ''); }
function params() { return new URLSearchParams(location.hash.replace(/^#/, '')); }
function teamKey(team) { return team.team_code; }
function selectedTeamKey() { return params().get('team'); }
function selectedLeague() { return params().get('league'); }
function assetLabel(asset) { return labels[asset.artifact] || asset.artifact.replaceAll('_', ' '); }
const WINNER_OVERRIDE_ARTIFACTS = new Set(['video', 'launching_video', 'poster']);
function isPublished(asset) {
  const winnerOverride = winnerByTeam.has(asset.team_code) && WINNER_OVERRIDE_ARTIFACTS.has(asset.artifact);
  const consentOk = asset.consent === 'Agree' || winnerOverride;
  const publishableOk = asset.publishable || winnerOverride;
  return asset.status === 'ok' && consentOk && publishableOk && Boolean(asset.preview_url || asset.view_url || asset.download_url);
}
function visibleAsset(asset) { return isPublished(asset) && !asset.artifact.endsWith('_thumbnail'); }
function teamAssets(team) { return assetsByTeam.get(teamKey(team)) || []; }
function leagueTeams(league) { return teams.filter(team => team.league === league); }
function orderedAssets(list, order = topicOrder) {
  const weight = new Map(order.map((name, index) => [name, index]));
  return [...list].sort((a, b) => (weight.get(a.artifact) ?? 99) - (weight.get(b.artifact) ?? 99) || assetLabel(a).localeCompare(assetLabel(b)));
}
function thumbnailUrl(asset) {
  return asset?.preview_url || asset?.view_url || '';
}
function primaryImage(team, artifact) { return teamAssets(team).find(asset => asset.artifact === artifact && isPublished(asset)); }
function topicLabels(team) { return orderedAssets(teamAssets(team).filter(visibleAsset)).map(assetLabel); }
function winnerInfo(team) { return winnerByTeam.get(teamKey(team)); }
function placeIcon(info) { return info ? `<span class="place place-${info.place}" title="${info.place}. place">${info.place}</span>` : ''; }
const placeClasses = { 1: 'gold', 2: 'silver', 3: 'bronze' };
function placeClass(info) { return info ? ` winner ${placeClasses[info.place] || ''}` : ''; }
function searchableText(team) {
  const win = winnerInfo(team);
  return normalize([
    team.team_code,
    team.team_name,
    team.league,
    team.country,
    win ? `${win.place} place winner top three podium` : '',
    ...(team.keywords || []),
    team.introduction || '',
    ...topicLabels(team),
    ...teamAssets(team).filter(visibleAsset).map(asset => asset.artifact.replaceAll('_', ' '))
  ].join(' '));
}
function setSelected(key) {
  if (key) location.hash = `team=${encodeURIComponent(key)}`;
  else history.pushState('', document.title, location.pathname + location.search);
  render();
}
function setLeague(league) {
  if (league) location.hash = `league=${encodeURIComponent(league)}`;
  else history.pushState('', document.title, location.pathname + location.search);
  render();
}
function scrollToAsset(artifact) {
  const el = document.getElementById(`asset-${artifact}`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function selectedTeam() { return teams.find(team => teamKey(team) === selectedTeamKey()); }
function passes(team, league) {
  const q = normalize($('#q').value).trim();
  const country = $('#country').value;
  const topic = $('#topic').value;
  const list = teamAssets(team).filter(visibleAsset);
  if (league && team.league !== league) return false;
  if (country && team.country !== country) return false;
  if (topic && !list.some(asset => asset.artifact === topic)) return false;
  if (q && !q.split(/\s+/).every(token => searchableText(team).includes(token))) return false;
  return true;
}
const THUMB_CONCURRENCY = 4;
const thumbQueue = [];
let thumbActive = 0;
let thumbObserver = null;
function attemptThumbLoad(img, attempt = 0) {
  const done = () => { thumbActive--; loadNextThumb(); };
  img.onload = done;
  img.onerror = () => {
    if (attempt < 2) setTimeout(() => attemptThumbLoad(img, attempt + 1), 800 * (attempt + 1) + Math.random() * 400);
    else { img.parentElement.classList.add('broken'); done(); }
  };
  img.src = img.dataset.src;
}
function loadNextThumb() {
  while (thumbActive < THUMB_CONCURRENCY && thumbQueue.length > 0) {
    const img = thumbQueue.shift();
    if (!document.body.contains(img)) continue;
    thumbActive++;
    attemptThumbLoad(img);
  }
}
function observeLazyThumbs() {
  if (!thumbObserver) {
    thumbObserver = new IntersectionObserver(entries => {
      for (const entry of entries) {
        if (entry.isIntersecting) {
          thumbObserver.unobserve(entry.target);
          thumbQueue.push(entry.target);
          loadNextThumb();
        }
      }
    }, { rootMargin: '200px' });
  }
  document.querySelectorAll('img.lazy-thumb[data-src]').forEach(img => thumbObserver.observe(img));
}
function renderThumb(team, artifact, label) {
  const asset = primaryImage(team, artifact);
  const src = thumbnailUrl(asset);
  return `<div class="thumb${src ? '' : ' broken'}">${src ? `<img class="lazy-thumb" data-src="${esc(src)}" alt="${esc(label)} for ${esc(team.team_name)}">` : '<span>No image</span>'}<span class="label">${esc(label)}</span></div>`;
}
function renderTopics(team, limit = 5) {
  const names = [...new Set(topicLabels(team).filter(name => !['Team photo', 'Robot photo'].includes(name)))];
  const shown = names.slice(0, limit);
  const extra = names.length - shown.length;
  return `<div class="topics">${shown.map(name => `<span class="topic">${esc(name)}</span>`).join('')}${extra > 0 ? `<span class="topic">+${extra} more</span>` : ''}</div>`;
}
function renderTeamCard(team) {
  const win = winnerInfo(team);
  return `<a class="team-card card${placeClass(win)}" href="#team=${encodeURIComponent(teamKey(team))}" aria-label="Open ${esc(team.team_name)}">
    ${placeIcon(win)}
    <div class="thumbs${team.league === 'Simulation' ? ' single' : ''}">${renderThumb(team, 'team_photo', 'Team')}${team.league === 'Simulation' ? '' : renderThumb(team, 'robot_photo', 'Robot')}</div>
    <div class="team-title"><div><h2>${esc(team.team_name)}</h2><div class="muted">${esc(team.league)} · ${esc(team.country)}</div></div></div>
    ${renderTopics(team)}
  </a>`;
}
function leagueStats(league) {
  const t = leagueTeams(league);
  const resources = t.reduce((sum, team) => sum + teamAssets(team).filter(visibleAsset).length, 0);
  return { teams: t.length, resources };
}
function renderWinnerRow(entry) {
  return `<a class="winner-row" href="#team=${encodeURIComponent(entry.team_code)}">${placeIcon(entry)}<span>${esc(entry.team_name)}</span></a>`;
}
function clearFilters() { $('#q').value = ''; $('#country').value = ''; $('#topic').value = ''; }
function renderBreadcrumb(segments) {
  $('#breadcrumb').innerHTML = segments.map((seg, i) => {
    if (i === segments.length - 1) return `<span class="tab active" aria-current="page">${esc(seg.label)}</span>`;
    return `<a class="tab" href="javascript:void(0)" onclick="${seg.action}">${esc(seg.label)}</a><span class="crumb-sep">&rsaquo;</span>`;
  }).join('');
}
function renderLanding() {
  clearFilters();
  $('#filters').hidden = true;
  renderBreadcrumb([{ label: 'Leagues' }]);
  $('#summary').textContent = `Choose a league · ${leagueOrder.length} leagues · ${Object.values(winners).flat().length} highlighted teams`;
  $('#main').innerHTML = `<section class="landing">
    <div><h2>Choose a league</h2><div class="muted">Top teams are shown as a preview. Open a league to browse and search all published teams in that league.</div></div>
    <section class="league-grid">${leagueOrder.map(league => {
      const stats = leagueStats(league);
      const leagueWinners = winners[league] || [];
      return `<article class="league-card">
        <div class="league-art"><span>${esc(league)}</span></div>
        <div class="league-head"><div><h3>${esc(league)}</h3><div class="muted">${stats.teams} teams · ${stats.resources} published resources</div></div></div>
        <div class="winners"><strong>Top 3 ${esc(league)}</strong>${leagueWinners.map(renderWinnerRow).join('')}</div>
        <div class="league-actions"><span class="muted">Images can be added later.</span><a class="show-more" href="#league=${encodeURIComponent(league)}">Show more</a></div>
      </article>`;
    }).join('')}</section>
  </section>`;
}
function renderLeague(league) {
  $('#filters').hidden = false;
  renderBreadcrumb([{ label: 'Leagues', action: "setLeague('')" }, { label: `${league} Teams` }]);
  const all = leagueTeams(league);
  const visible = all.filter(team => passes(team, league));
  const resourceCount = visible.reduce((sum, team) => sum + teamAssets(team).filter(visibleAsset).length, 0);
  $('#summary').textContent = `${visible.length}/${all.length} ${league} teams · ${resourceCount} published resources`;
  $('#main').innerHTML = `<section class="league-view">
    <div><h2>${esc(league)} teams</h2><div class="muted">Search and filter published team documents within this league.</div></div>
    ${visible.length ? `<section class="directory">${visible.map(renderTeamCard).join('')}</section>` : '<section class="empty">No teams match the current search.</section>'}
  </section>`;
}
function renderAsset(asset) {
  const title = assetLabel(asset);
  const url = asset.preview_url || asset.view_url || asset.download_url;
  const openUrl = asset.view_url || url;
  if (asset.artifact === 'source_code') {
    return `<article id="asset-${esc(asset.artifact)}" class="asset compact"><h3>${esc(title)}</h3><p>Download or inspect the published source archive in Drive.</p><p><a class="open-link" href="${esc(openUrl)}" target="_blank" rel="noopener">Open ${esc(title)}</a></p></article>`;
  }
  return `<article id="asset-${esc(asset.artifact)}" class="asset${asset.artifact === 'video' ? ' video-feature' : ''}"><h3>${esc(title)}</h3><iframe src="${esc(url)}" title="${esc(title)} for ${esc(teamByCode.get(asset.team_code)?.team_name || '')}" loading="lazy" allow="autoplay; fullscreen"></iframe><p><a class="open-link" href="${esc(openUrl)}" target="_blank" rel="noopener">Open in Drive</a></p></article>`;
}
function renderDetail(team) {
  const list = orderedAssets(teamAssets(team).filter(visibleAsset), detailOrder).filter(asset => detailOrder.includes(asset.artifact));
  const topics = orderedAssets(teamAssets(team).filter(visibleAsset));
  const win = winnerInfo(team);
  $('#filters').hidden = true;
  renderBreadcrumb([
    { label: 'Leagues', action: "setLeague('')" },
    { label: `${team.league} Teams`, action: `setLeague('${esc(team.league)}')` },
    { label: team.team_name }
  ]);
  $('#summary').textContent = `${team.team_name} · ${team.league} · ${team.country}`;
  $('#main').innerHTML = `<section class="detail">
    <section class="hero">
      <div class="hero-media${team.league === 'Simulation' ? ' single' : ''}">${renderThumb(team, 'team_photo', 'Team photo')}${team.league === 'Simulation' ? '' : renderThumb(team, 'robot_photo', 'Robot photo')}</div>
      <div class="hero-copy">
        <div class="title-row">${placeIcon(win)}</div>
        <h2>${esc(team.team_name)}</h2>
        <div class="muted">${esc(team.league)} league · ${esc(team.country)}${win ? ` · ${win.place}. place` : ''}</div>
        <div class="facts"><div class="fact"><span class="muted">Published resources</span><strong>${list.length}</strong></div><div class="fact"><span class="muted">Topics</span><strong>${topics.length}</strong></div><div class="fact"><span class="muted">Country</span><strong>${esc(team.country || 'Unknown')}</strong></div></div>
        ${team.keywords && team.keywords.length ? `<div class="keywords">${team.keywords.map(k => `<span class="keyword">${esc(k)}</span>`).join('')}</div>` : ''}
        <div class="quicklinks">${list.map(asset => `<a href="javascript:void(0)" onclick="scrollToAsset('${esc(asset.artifact)}')">${esc(assetLabel(asset))}</a>`).join('') || '<span class="muted">No published resources configured for this team.</span>'}</div>
      </div>
    </section>
    ${team.introduction ? `<section class="intro"><h2 class="section-title">Introduction</h2>${team.introduction.split('\n\n').map(p => `<p>${esc(p)}</p>`).join('')}</section>` : ''}
    <h2 class="section-title">Published team information</h2>
    ${list.length ? `<section class="asset-grid">${list.map(renderAsset).join('')}</section>` : '<section class="empty">No published resources are currently available for this team.</section>'}
  </section>`;
}
function render() {
  const team = selectedTeam();
  const league = selectedLeague();
  if (selectedTeamKey() && team) renderDetail(team);
  else if (league) renderLeague(league);
  else renderLanding();
  observeLazyThumbs();
}
async function init() {
  const [teamData, assetData, winnersData] = await Promise.all([
    fetch('data/teams.json').then(resp => resp.json()),
    fetch('data/assets.json').then(resp => resp.json()),
    fetch('data/winners.json').then(resp => resp.json())
  ]);
  teams = teamData.teams;
  winners = winnersData.leagues || {};
  winnerByTeam = new Map();
  for (const [league, entries] of Object.entries(winners)) for (const entry of entries) winnerByTeam.set(entry.team_code, { ...entry, league });
  teamByCode = new Map(teams.map(team => [team.team_code, team]));
  assets = assetData.assets.filter(asset => isPublished(asset) && !(teamByCode.get(asset.team_code)?.league === 'Simulation' && (asset.artifact === 'launching_video' || asset.artifact === 'launching_video_thumbnail')));
  assetsByTeam = new Map();
  for (const asset of assets) {
    if (!assetsByTeam.has(asset.team_code)) assetsByTeam.set(asset.team_code, []);
    assetsByTeam.get(asset.team_code).push(asset);
  }
  for (const country of [...new Set(teams.map(team => team.country))].filter(Boolean).sort()) $('#country').insertAdjacentHTML('beforeend', `<option>${esc(country)}</option>`);
  for (const artifact of topicOrder.filter(artifact => assets.some(asset => asset.artifact === artifact))) $('#topic').insertAdjacentHTML('beforeend', `<option value="${esc(artifact)}">${esc(labels[artifact])}</option>`);
  ['q', 'country', 'topic'].forEach(id => $('#' + id).addEventListener('input', () => { const team = selectedTeam(); if (team) setLeague(team.league); else if (selectedLeague()) render(); }));
  window.addEventListener('hashchange', render);
  render();
}
init().catch(error => { $('#main').innerHTML = `<section class="empty"><strong>Could not load data.</strong><pre>${esc(error.stack || error)}</pre></section>`; });
</script>
</body>
</html>
